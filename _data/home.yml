experience:
  label: "Experience"
  heading: "A decade in hospitality, <br>luxury retail and spirits"
  jobs:
    - years: "2023 – 2026"
      company: "Diageo"
      role: "Account Manager, Trend Leading Accounts · Frankfurt & Stuttgart"
      points:
        - "Full territory responsibility for trend-leading and luxury accounts: client management, new business and outlet prioritisation."
        - "Selected to build the Frankfurt territory, not actively developed for around four years; grew the account base in each territory, Frankfurt and Stuttgart, from 70–80 to around 110."
        - "Led both territories in parallel, each with its own budget responsibility."
        - "Segmented the portfolio by priority and volume; around 80–100 contract negotiations and regular brand activations."
    - years: "2021 – 2023"
      company: "Louis Vuitton"
      role: "Team Manager, Menswear, Watches & Travel · Stuttgart"
      points:
        - "Led a team of 12 in a store of 20, with day-to-day responsibility for store operations."
        - "Conducted recruiting interviews."
        - "Assortment decisions, annual planning and client events."
        - "Stock, replenishment and regional VM standards."
    - years: "2020 – 2021"
      company: "Le Grand Bellevue"
      role: "Assistant Front Office Manager · Gstaad"
      points:
        - "Deputy head of front office, guest services, valet and concierge, a team of 10."
        - "Five-star superior hotel with 57 rooms and suites."
    - years: "2019 – 2020"
      company: "Montblanc"
      role: "Assistant Store Manager · Zürich"
      points:
        - "Regularly deputised for the store manager in a team of seven; responsible for rostering, boutique KPIs and onboarding."
        - "Raised the average transaction value by 40%."
        - "Local client share from around 70% to over 80%."
    - years: "2016 – 2018"
      company: "Hospitality"
      role: "Three cities, three roles"
      points:
        - "Kempinski Frankfurt: Rooms Division Management Trainee."
        - "Radisson Blu Berlin: Front Office Agent."
        - "Steigenberger Munich: Shift Leader in the opening team."

