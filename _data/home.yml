expertise:
  label: "Expertise"
  heading: "What I know best"
  image: "/images/hans-baer-focus.webp"
  image_alt: "Hans X. Baer"
  pillars:
    - title: "Retail leadership"
      text: "Leading a team on the shop floor: hiring the right people, setting standards and running the store day to day, as I did at Montblanc and Louis Vuitton."
    - title: "Commercial strategy"
      text: "Deciding where time and budget go. At Diageo I developed two territories, chose which accounts to prioritise and negotiated the agreements behind them."
    - title: "Guest experience"
      text: "Knowing guests well enough that they come back. It started at the hotel front office and still shapes how I approach clienteling and events."

travel:
  label: "Travel"
  heading: "Away from work"
  paragraphs:
    - "I was given the chance to travel from a young age, and much of it took me to Asia. That was more than twenty years ago, before the world felt as connected as it does now. For a European, Asia was still far away and far less familiar than it seems today."
    - 'Those trips shaped how I see things. What stays with me is rarely the sights, but the small things: how a city starts its day, how people host, what ends up on the table. <span style="white-space:nowrap">I still travel whenever I can.</span>'
