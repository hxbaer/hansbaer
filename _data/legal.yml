        <h3>Controller</h3>
        <p>The controller responsible for the processing of personal data on this website is Hans X. Baer, 60311 Frankfurt am Main, Germany, email: <a href="mailto:hans@hansbaer.ch">hans@hansbaer.ch</a>.</p>

        <h3>Hosting</h3>
        <p>This website is hosted by GitHub Pages, a service of GitHub, Inc., USA. When you visit the website, the hosting provider processes technically necessary data, in particular your IP address, the date and time of access, the page requested and browser and device information, in order to deliver the website securely and reliably. The legal basis is Art. 6 (1) (f) GDPR. GitHub, Inc. is certified under the EU-U.S. Data Privacy Framework. Further information can be found in the GitHub privacy statement.</p>

        <h3>Fonts and images</h3>
        <p>The fonts and images used on this website are hosted together with the website itself. No connection is made to servers operated by Google or other font or media providers.</p>

        <h3>Cookies and analytics</h3>
        <p>The operator of this website does not set any cookies of their own and does not use any analytics, tracking or advertising services.</p>

        <h3>Contact by email</h3>
        <p>If you get in touch by email, the information you provide will be used solely to handle your enquiry and will not be passed on without your consent. The legal basis is Art. 6 (1) (b) or (f) GDPR.</p>

        <h3>Link to LinkedIn</h3>
        <p>This website contains a simple link to LinkedIn. No data is transferred to LinkedIn when you visit this website; you are only redirected there once you click the link. The privacy policy of LinkedIn Ireland Unlimited Company applies there.</p>

        <h3>Your rights</h3>
        <p>You have the right to access, rectification, erasure and restriction of processing of your personal data, the right to data portability and the right to object to processing. To exercise these rights, please use the email address above. You also have the right to lodge a complaint with a data protection supervisory authority, such as the Hessian Commissioner for Data Protection and Freedom of Information.</p>
